id: conflicting-truth-001
source: Day 8 第 5 條：AC 彼此衝突
category: conflicting-truth
input:
  name: 問卷填答
  description: |
    活動問卷開放填寫，填完送出就可以領獎品。
  acceptance_criteria:
    - 使用者填完問卷送出後可以領取獎品
    - 同一個帳號只能填寫一次
    - 使用者可以重複填寫更新答案
    - 問卷關閉後不能再填寫
goal_state:
  goal:      { mode: must_include, keywords: [] }
  scope_in:  { mode: must_include, keywords: [] }
  scope_out: { mode: must_include, keywords: [] }
  ac_flags:
    mode: exact_set
    values: [3:conflict]   # 作者 2026-09-16：第 3 條跟第 2 條衝突；且第 1 條送出即領獎，領完再更新也沒意義
  comment_wording: { mode: ignore, note: 措辭不比 }
  tool_calls:      { mode: ignore, note: 查了幾次、查了誰不比 }
  goal_wording:    { mode: ignore, note: 判不到 }
