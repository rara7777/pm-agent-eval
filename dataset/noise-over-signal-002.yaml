id: noise-over-signal-002
source: Day 8 第 8 條：每個欄位都填滿、敘述來回繞
category: noise-over-signal
input:
  name: 搜尋結果排序
  description: |
    關於搜尋這件事，我們收到蠻多回饋的。使用者在搜尋的時候，常常找不到他們想要的東西，
    這個問題其實從去年就有人提過，當時因為優先度的關係沒有處理。現在既然要處理，
    就希望可以一次做好。搜尋這件事牽涉到很多面向，包含關鍵字的比對方式、
    結果的排序邏輯、以及要不要支援錯字容忍。關於排序，目前是依照建立時間，
    但使用者其實比較在意相關性。相關性怎麼算是一個問題，可能要看標題有沒有命中、
    描述有沒有命中、以及這個項目最近有沒有被點擊。點擊數這件事我們現在有記錄，
    但沒有拿來用。另外分頁也是一個問題，現在一頁二十筆，使用者要翻很多頁。
  acceptance_criteria:
    - 搜尋結果依相關性排序
    - 標題命中的權重高於描述命中
    - 搜尋結果支援分頁
goal_state:
  goal:      { mode: must_include, keywords: [] }
  scope_in:  { mode: must_include, keywords: [] }
  scope_out: { mode: must_include, keywords: [] }
  ac_flags:
    mode: exact_set
    values: [1:unverifiable, 3:mismatch]   # 作者 2026-09-16：相關性 description 自己說還沒定義；分頁現在就有，description 抱怨的是一頁二十筆太少，這條寫成「支援分頁」等於沒改
  comment_wording: { mode: ignore, note: 措辭不比 }
  tool_calls:      { mode: ignore, note: 查了幾次、查了誰不比 }
  goal_wording:    { mode: ignore, note: 判不到 }
