id: merged-concerns-001
source: Day 8 第 1 條：Goal 與 Scope 黏在同一句
category: merged-concerns
input:
  name: 會員點數
  description: |
    下個月週年慶要推點數回饋。消費金額換點數這件事要能設定比例，後台也要看得到每個人現在有幾點，
    注意不要被刷點數的人鑽漏洞。對了前陣子客服說會員中心載入很慢，一起看看。
  acceptance_criteria:
    - 消費完成後會員可以在會員中心看到本次獲得的點數
    - 後台可以設定每消費多少元換一點
    - 同一個帳號短時間內重複下單取消不應該累積點數
    - 會員中心要順
    - 點數有效期限到期後自動歸零
goal_state:
  goal:      { mode: must_include, keywords: [] }
  scope_in:  { mode: must_include, keywords: [] }
  scope_out: { mode: must_include, keywords: [] }
  ac_flags:
    mode: exact_set
    values: [3:unverifiable, 4:unverifiable]   # 作者 2026-09-16：第 3 條「短時間內」沒有數字；第 4 條「要順」沒說是 UX 還是效能，驗不了；效能那件事該進 Scope out
  comment_wording: { mode: ignore, note: 措辭不比 }
  tool_calls:      { mode: ignore, note: 查了幾次、查了誰不比 }
  goal_wording:    { mode: ignore, note: 判不到 }
