id: noise-over-signal-001
source: Day 8 第 9 條：AC 12 條其中 8 條寫成感想
category: noise-over-signal
input:
  name: 購物車改版
  description: |
    購物車現在的體驗不太好，使用者常常在這一步流失。這次改版希望能提升轉換，
    讓整個流程更順暢，也要考慮到行動裝置的使用情境，讓使用者在任何裝置上都能有一致的體驗。
  acceptance_criteria:
    - 購物車頁面要好用
    - 流程要順
    - 使用者可以修改商品數量
    - 體驗要一致
    - 手機上要好操作
    - 使用者可以移除購物車中的商品
    - 畫面要美觀
    - 載入速度要快
    - 購物車內容在重新登入後仍然保留
    - 要符合品牌形象
    - 結帳按鈕要明顯
    - 轉換率要提升
# goal_state 待作者手標
