id: noise-over-signal-003
source: Day 8 D 類延伸：真正的需求埋在最後一句
category: noise-over-signal
input:
  name: 報表匯出
  description: |
    月底大家都在做報表，這件事每個月都會被提一次。業務那邊習慣用 Excel，
    財務那邊習慣用 CSV，之前也討論過要不要直接串 BI，但那個成本太高。
    現階段先讓大家可以自己匯出就好。匯出的欄位大家意見也不太一樣，
    業務想看客戶名稱跟金額，財務想看稅額跟發票號碼。開會討論過兩次，
    第二次有結論但沒有人寫下來。總之就是要能選欄位再匯出。
  acceptance_criteria:
    - 使用者可以匯出報表
    - 匯出前可以選擇要包含哪些欄位
    - 支援 CSV 格式
goal_state:
  goal:      { mode: must_include, keywords: [] }
  scope_in:  { mode: must_include, keywords: [] }
  scope_out: { mode: must_include, keywords: [] }
  ac_flags:
    mode: exact_set
    values: [2:unverifiable, 3:mismatch]   # 作者 2026-09-16：可選欄位的結論沒人寫下來；description 說業務用 Excel，第 3 條只寫 CSV
  comment_wording: { mode: ignore, note: 措辭不比 }
  tool_calls:      { mode: ignore, note: 查了幾次、查了誰不比 }
  goal_wording:    { mode: ignore, note: 判不到 }
