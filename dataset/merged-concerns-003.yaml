input:
  name: 電子報退訂
  description: |
    要讓使用者可以退訂電子報，用 unsubscribe token 放在信件底部連結，點了就進退訂頁，
    退訂頁要有原因調查，這樣行銷那邊才知道為什麼大家要退。
  acceptance_criteria:
    - 信件底部有退訂連結
    - 點退訂連結後不需登入即可完成退訂
    - 退訂後不再收到行銷信
    - 退訂原因會記錄下來給行銷看
