id: ac-conflict-001
source: Day 3 推演過的掉法，改一行 prompt 之後最先掉的那條
category: conflicting-truth
input:
  name: 優惠碼功能
  description: |
    業務下週要跑活動，所以要有優惠碼。輸入代碼價格會變，後台要能新增，
    注意不要被亂用。之前客戶反應結帳頁很慢，順便看一下。手機上也要能用。
  acceptance_criteria:
    - 使用者輸入優惠碼後看到折扣後金額
    - 優惠碼一人只能用一次
    - 優惠碼可以無限次使用
    - 結帳流程要順
    - 後台可以設定折扣百分比或固定金額
    - 活動結束後過期的碼不能用，但已套用的訂單不受影響
    - 手機版體驗要好
